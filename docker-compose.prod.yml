# Productie: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?zet POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: wv_portal
    volumes:
      - wv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wv -d wv_portal"]
      interval: 5s
      timeout: 5s
      retries: 10
    # geen ports: Postgres is alleen bereikbaar binnen het Docker-netwerk

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://wv:${POSTGRES_PASSWORD}@postgres:5432/wv_portal
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: https://app.white-vision.nl
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "127.0.0.1:18090:80"   # alleen lokaal; Plesk proxyt hiernaartoe

volumes:
  wv_pgdata:
