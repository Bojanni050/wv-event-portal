services:
  postgres:
    image: postgres:16-alpine
    container_name: wv-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wv
      POSTGRES_PASSWORD: wv
      POSTGRES_DB: wv_portal
    ports:
      - "5432:5432"
    volumes:
      - wv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wv -d wv_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wv_pgdata:
